<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Foltï Charge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{background:var(--paper)}
  .auth{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1fr 1fr}
  .auth-form{display:flex;flex-direction:column;padding:28px var(--gut)}
  .auth-form .logo{color:var(--ink)}
  .auth-form .logo b{color:var(--ink)}
  .form{margin:auto 0;width:100%;max-width:400px;align-self:center}
  .form h1{font-size:clamp(48px,5vw,72px)}
  .form>p{margin:10px 0 32px;color:var(--grey)}
  .field{display:block;margin-bottom:18px}
  .field span{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
  .control{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border-radius:10px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s}
  .control:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
  .control svg{width:20px;height:20px;color:var(--grey);flex:none}
  .control input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:100%}
  .eye{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--grey)}
  .eye:hover{background:var(--paper);color:var(--ink)}
  .row{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 26px;font-size:15px}
  .row label{display:flex;align-items:center;gap:8px;cursor:pointer}
  .row input{width:18px;height:18px;accent-color:var(--ink)}
  .row a{font-weight:600;border-bottom:1.5px solid var(--bay)}
  .form .btn{width:100%;min-height:54px;font-size:17px}
  .alt{margin-top:22px;text-align:center;color:var(--grey);font-size:15px}
  .alt a{color:var(--ink);font-weight:600}
  .auth-foot{font-size:13px;color:var(--grey)}
  .auth-art{position:relative;background:var(--asphalt);color:var(--white);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:48px}
  .auth-art .lots{position:absolute;inset:0;width:100%;height:100%}
  .auth-card{position:relative;background:rgba(39,43,47,.9);backdrop-filter:blur(10px);border-radius:16px;padding:22px 24px;max-width:420px;box-shadow:inset 0 0 0 1px var(--line-inv)}
  .auth-card small{display:block;color:var(--grey-inv);font-size:14px}
  .auth-card b{display:block;font-family:var(--display);font-size:54px;font-weight:700;line-height:1;margin:6px 0 10px}
  .auth-card p{color:var(--grey-inv);font-size:15px}
  @media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{display:none}}
</style>
</head>
<body>
<div class="auth">
  <div class="auth-form">
    <a class="logo" href="index.html" aria-label="Foltï Charge home"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="var(--bay)"/><path d="M15.5 5 8.5 15.5h5L12 23l7.5-10.5h-5L15.5 5Z" fill="var(--ink)"/></svg><span>Foltï <b>Charge</b></span></a>
    <form class="form" onsubmit="return false" novalidate>
      <h1>Welcome back.</h1>
      <p>Log in to manage your stations, vehicles and fleet.</p>
      <label class="field"><span>Email</span>
        <span class="control"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><input type="email" autocomplete="email" placeholder="you@company.com"></span>
      </label>
      <label class="field"><span>Password</span>
        <span class="control"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><input id="pw" type="password" autocomplete="current-password"><button class="eye" type="button" aria-label="Show password" onclick="const i=document.getElementById('pw');const s=i.type==='password';i.type=s?'text':'password';this.setAttribute('aria-label',s?'Hide password':'Show password')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></span>
      </label>
      <div class="row"><label><input type="checkbox"> Keep me logged in</label><a href="#">Forgot password?</a></div>
      <button class="btn btn-ink" type="submit">Log in</button>
      <p class="alt">New to Foltï Charge? <a href="#">Talk to our team</a></p>
    </form>
    <p class="auth-foot">© 2026 Foltï Charge</p>
  </div>
  <aside class="auth-art" aria-hidden="true">
    <svg class="lots" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
      <rect width="600" height="800" fill="#1d2023"/>
      <g fill="#f5c518">
        <rect x="60" y="80" width="8" height="260"/><rect x="200" y="80" width="8" height="260"/><rect x="340" y="80" width="8" height="260"/><rect x="480" y="80" width="8" height="260"/>
        <rect x="60" y="80" width="428" height="8"/>
        <rect x="60" y="460" width="8" height="260"/><rect x="200" y="460" width="8" height="260"/><rect x="340" y="460" width="8" height="260"/><rect x="480" y="460" width="8" height="260"/>
        <rect x="60" y="712" width="428" height="8"/>
      </g>
      <g fill="#272b2f"><rect x="110" y="98" width="46" height="66" rx="8"/><rect x="250" y="98" width="46" height="66" rx="8"/><rect x="390" y="98" width="46" height="66" rx="8"/></g>
      <g><rect x="122" y="106" width="22" height="6" rx="3" fill="#38c977"/><rect x="262" y="106" width="22" height="6" rx="3" fill="#f5c518"/><rect x="402" y="106" width="22" height="6" rx="3" fill="#38c977"/></g>
      <rect x="226" y="196" width="96" height="126" rx="22" fill="#3a4046"/>
      <path d="M273 164C273 180 268 188 262 196" stroke="#15171a" stroke-width="6" fill="none"/>
      <g fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2" stroke-dasharray="14 14"><path d="M0 400H600"/></g>
    </svg>
    <div class="auth-card">
      <small>Across your network today</small>
      <b>1,284 kWh</b>
      <p>delivered in 212 sessions. 3 chargers need attention.</p>
    </div>
  </aside>
</div>
</body>
</html>
